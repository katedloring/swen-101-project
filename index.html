<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <h1>SnackQuest</h1>

    <div class="search">
        <form id="search-form" action="search/by_product">
            <input type="text" id="search-input" oninput="updateSearchLink();">

            <div>
                <button type="submit">
                    <a id="search-link" href="search/by_product">Search</a>
                </button>

                <select id="search-selector" onchange="updateSearchLink(); clearSearchBox();">
                    <option value="by_product" selected>by product</option>
                    <option value="by_location">by location</option>
                </select>
            </div>
        </form>
    </div>

    <nav>
        <button type="button">
            <a href="notifications">Notifications</a>
        </button>

        <button type="button">
            <a href="map">Map</a>
        </button>
    </nav>

    <script>
        function updateSearchLink() {
            select = document.getElementById("search-selector");
            searchLink = "search/" + select.value + "?q=" + document.getElementById("search-input").value;
            document.getElementById("search-link").href = searchLink;
            document.getElementById("search-form").action = searchLink;
        }

        updateSearchLink();

        function clearSearchBox() {
            document.getElementById("search-input").value = "";
        }
    </script>
</body>
</html>
