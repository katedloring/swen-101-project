<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <h1>SnackQuest</h1>

    <div class="search">
        <form>
            <input type="text">

            <div>
                <button type="submit">
                    <a id="search-link" href="search/by_product">Search</a>
                </button>

                <select id="search-selector" onchange="updateSearchLink()">
                    <option value="by_product" selected>by product</option>
                    <option value="by_location">by location</option>
                </select>
            </div>
        </form>
    </div>

    <nav>
        <button type="button">
            <a href="notifications">Notifications</a>
        </button>

        <button type="button">
            <a href="map">Map</a>
        </button>
    </nav>

    <script>
        function updateSearchLink() {
            select = document.getElementById("search-selector");
            document.getElementById("search-link").href = "search/" + select.value;
        }

        updateSearchLink();
    </script>
</body>
</html>
